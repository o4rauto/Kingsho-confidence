<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>LAB — Personagens chibi (Bastion Rush)</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#0e1220; overflow:hidden; font-family:system-ui,sans-serif; }
  #c { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; left:12px; top:12px; padding:8px 11px; border-radius:10px;
    background:rgba(0,0,0,.42); color:#cfe; font-size:12px; line-height:1.5; pointer-events:none; }
  #hud b { color:#9fe0ff; }
  #err { color:#ff8a8a; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three.module.js",
  "three/addons/": "../vendor/addons/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><b>LAB · Personagens chibi</b></div>
  <div>Atual: <span id="who">Mago Herói</span></div>
  <div>Three r<span id="rev">?</span> · toon vinil + contorno + bloom</div>
  <div id="err"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Rig } from './chibi.js';
import { buildHeroMage } from './hero.js';
import { buildGrunt, buildRunner, buildShield } from './monsters.js';

// registro de personagens (nome → builder + rótulo + foco de câmera)
const CHARS = {
  hero:   { build: buildHeroMage, label: 'Pyr (bruxa de fogo)', look: 1.35, dist: 7.4 },
  grunt:  { build: buildGrunt,    label: 'Saqueador (grunt)', look: 1.1, dist: 6.8 },
  runner: { build: buildRunner,   label: 'Batedor (runner)', look: 1.0, dist: 6.6 },
  shield: { build: buildShield,   label: 'Shield',     look: 1.1,  dist: 7.2 },
};

const LAB = window.LAB = { ready:false, error:null, frames:0, rev:THREE.REVISION, webgl:null, who:'hero' };
document.getElementById('rev').textContent = THREE.REVISION;
function fail(m){ LAB.error=String(m); document.getElementById('err').textContent='ERRO: '+LAB.error; console.error(m); }
window.addEventListener('error', e=>fail(e.message));
window.addEventListener('unhandledrejection', e=>fail(e.reason&&e.reason.message||e.reason));

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, preserveDrawingBuffer:true });
LAB.webgl = renderer.capabilities.isWebGL2 ? 'webgl2' : 'webgl';
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping; // cores saturadas "mobile"

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090b13);

const which = new URLSearchParams(location.search).get('c') || 'hero';
const CH = CHARS[which] || CHARS.hero;
LAB.who = which;
document.getElementById('who').textContent = CH.label;

const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
function frameCam(){ camera.position.set(0, CH.look + 0.65, CH.dist); camera.lookAt(0, CH.look, 0); }
frameCam();

// luz: HEMISFÉRICA (céu claro em cima / chão escuro embaixo) = gradiente top-down
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x171f33, 0.6));
const key = new THREE.DirectionalLight(0xfff2dc, 1.7); key.position.set(3.5,6.5,4.5); scene.add(key);
const rim = new THREE.DirectionalLight(0x6fb0ff, 0.85); rim.position.set(-4.5,3,-3.5); scene.add(rim);
const fillF = new THREE.DirectionalLight(0xffffff, 0.32); fillF.position.set(0,2,8); scene.add(fillF);

// sombra de contato (disco escuro achatado sob os pés) → "pé no chão"
const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(1.15, 32),
  new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.34 }));
shadow.rotation.x = -Math.PI/2; shadow.position.y = 0.05; scene.add(shadow);

// pódio (palco do personagem, estilo vitrine)
const podium = new THREE.Mesh(
  new THREE.CylinderGeometry(2.0, 2.25, 0.5, 40),
  new THREE.MeshToonMaterial({ color:0x232a44 }));
podium.position.y = -0.25; scene.add(podium);
const podTop = new THREE.Mesh(
  new THREE.CylinderGeometry(1.85, 1.85, 0.06, 40),
  new THREE.MeshToonMaterial({ color:0x2f3a5e }));
podTop.position.y = 0.01; scene.add(podTop);

// turntable + personagem
const turntable = new THREE.Group(); scene.add(turntable);
let rig, model;
function loadChar(){
  ({ model } = CH.build());
  rig = new Rig(model);
  turntable.add(rig);
  window.__lab = { root: model, camera, THREE };
}
loadChar();

// post: contorno de SILHUETA única (linha limpa em volta do personagem, sem
// riscar as interseções internas) + bloom (orbe/estrela/olhos "brilham")
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const outline = new OutlinePass(new THREE.Vector2(1,1), scene, camera, [model]);
outline.edgeStrength = 5.0;
outline.edgeGlow = 0.0;
outline.edgeThickness = 1.4;
outline.pulsePeriod = 0;
outline.visibleEdgeColor.set('#0b0d14');
outline.hiddenEdgeColor.set('#0b0d14');
composer.addPass(outline);
const bloom = new UnrealBloomPass(new THREE.Vector2(1,1), 0.5, 0.45, 0.96);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false); composer.setSize(w,h); bloom.setSize(w,h); outline.setSize(w,h);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// API p/ harness headless: girar p/ um ângulo fixo (graus)
LAB.setAngle = (deg)=>{ turntable.rotation.y = deg*Math.PI/180; };
LAB.spin = true;

const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if (rig) rig.update(t, { breathe:0.04, bob:0.05, sway:0.015 });
  if (LAB.spin) turntable.rotation.y += dt*0.6;
  composer.render();
  LAB.frames++;
  if (!LAB.ready && rig && LAB.frames>3) LAB.ready=true;
}
tick();
</script>
</body>
</html>

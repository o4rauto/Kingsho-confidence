<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>LAB — Sprites 2.5D (estilo Don't Starve)</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#0b1018; overflow:hidden; font-family:system-ui,sans-serif; }
  #c { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; left:12px; top:12px; padding:8px 11px; border-radius:10px;
    background:rgba(0,0,0,.45); color:#cfe; font-size:12px; line-height:1.5; pointer-events:none; }
  #hud b { color:#9fe0ff; } #err { color:#ff8a8a; }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/addons/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><b>LAB · Sprites 2.5D</b> (Don't Starve-like)</div>
  <div>Atual: <span id="who">pyr</span></div>
  <div>arte recortada da ficha · billboard + sombra de contato</div>
  <div id="err"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// registro: sprite (recorte da ficha) + altura no mundo
const SPRITES = {
  pyr: { file: 'sprites/pyr.png', label: 'Pyr (herói)', h: 3.0 },
};

const LAB = window.LAB = { ready:false, error:null, frames:0, webgl:null, who:'pyr' };
function fail(m){ LAB.error=String(m); document.getElementById('err').textContent='ERRO: '+LAB.error; console.error(m); }
addEventListener('error', e=>fail(e.message));
addEventListener('unhandledrejection', e=>fail(e.reason&&e.reason.message||e.reason));

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, preserveDrawingBuffer:true });
LAB.webgl = renderer.capabilities.isWebGL2 ? 'webgl2' : 'webgl';
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c1320);
scene.fog = new THREE.Fog(0x0c1320, 9, 22);

const which = new URLSearchParams(location.search).get('c') || 'pyr';
const SP = SPRITES[which] || SPRITES.pyr;
LAB.who = which; document.getElementById('who').textContent = SP.label;

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
camera.position.set(0, 2.4, 7.2); camera.lookAt(0, 1.4, 0);

// ── CHÃO: arena gelada escura (radial sutil) ──
function groundTex(){
  const s=512, cv=document.createElement('canvas'); cv.width=cv.height=s; const g=cv.getContext('2d');
  const grd=g.createRadialGradient(s/2,s/2,40,s/2,s/2,s/2);
  grd.addColorStop(0,'#243349'); grd.addColorStop(0.6,'#16202e'); grd.addColorStop(1,'#0c121c');
  g.fillStyle=grd; g.fillRect(0,0,s,s);
  // textura de gelo rachado (linhas finas)
  g.strokeStyle='rgba(120,160,200,0.10)'; g.lineWidth=2;
  for(let i=0;i<40;i++){g.beginPath();const x=Math.random()*s,y=Math.random()*s;g.moveTo(x,y);g.lineTo(x+(Math.random()-0.5)*120,y+(Math.random()-0.5)*120);g.stroke();}
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const ground = new THREE.Mesh(new THREE.CircleGeometry(9, 48),
  new THREE.MeshBasicMaterial({ map: groundTex() }));
ground.rotation.x = -Math.PI/2; scene.add(ground);

// ── grupo do personagem (gira no turntable) ──
const turntable = new THREE.Group(); scene.add(turntable);

// sombra de contato (elipse suave)
function shadowTex(){
  const s=256, cv=document.createElement('canvas'); cv.width=cv.height=s; const g=cv.getContext('2d');
  const grd=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2); grd.addColorStop(0,'rgba(0,0,0,0.55)'); grd.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd; g.fillRect(0,0,s,s); return new THREE.CanvasTexture(cv);
}
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.4),
  new THREE.MeshBasicMaterial({ map: shadowTex(), transparent:true, depthWrite:false }));
shadow.rotation.x = -Math.PI/2; shadow.position.y = 0.02; turntable.add(shadow);

// ── BILLBOARD do sprite ──
const tex = new THREE.TextureLoader().load(SP.file, t=>{
  t.colorSpace = THREE.SRGBColorSpace; t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter;
  const ar = t.image.width / t.image.height;
  sprite.scale.set(SP.h * ar, SP.h, 1);
}, undefined, e=>fail('tex: '+e));
const spriteMat = new THREE.MeshBasicMaterial({ map: tex, transparent:true, alphaTest:0.5, side:THREE.DoubleSide });
const sprite = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), spriteMat);
sprite.position.y = SP.h/2 + 0.02; turntable.add(sprite);

// post: bloom suave (a chama do cajado "acende")
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1,1), 0.35, 0.5, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); composer.setSize(w,h); bloom.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

LAB.setAngle = (deg)=>{ turntable.rotation.y = deg*Math.PI/180; };
LAB.spin = true;

const clock = new THREE.Clock();
function tick(){
  const t = clock.getElapsedTime();
  if (LAB.spin) turntable.rotation.y = Math.sin(t*0.5)*0.5;
  // billboard: o sprite sempre encara a câmera (contra a rotação do turntable)
  sprite.rotation.y = -turntable.rotation.y;
  sprite.position.y = SP.h/2 + 0.02 + Math.sin(t*1.6)*0.04; // bob leve
  composer.render();
  LAB.frames++; LAB.ready = true;
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>

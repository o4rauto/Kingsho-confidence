<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>LAB — Spike de render (Three.js vendorizado · toon + bloom + turntable)</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#0b0d12; overflow:hidden; font-family:system-ui,sans-serif; }
  #c { display:block; width:100vw; height:100vh; }
  #hud {
    position:fixed; left:10px; top:10px; padding:8px 10px; border-radius:8px;
    background:rgba(0,0,0,.45); color:#cfe; font-size:12px; line-height:1.5;
    pointer-events:none; max-width:60vw;
  }
  #hud b { color:#8fd6ff; }
  #err { color:#ff8a8a; white-space:pre-wrap; }
</style>
<!-- ZERO CDN: tudo resolvido para arquivos locais vendorizados em /vendor -->
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three.module.js",
    "three/addons/": "../vendor/addons/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><b>LAB · Etapa 0 — Spike de render</b></div>
  <div>Three.js r<span id="rev">?</span> (vendorizado, sem CDN)</div>
  <div>Modelo: <span id="model">RobotExpressive (CC0)</span></div>
  <div>Anim: <span id="anim">—</span> · Frames: <span id="frames">0</span></div>
  <div>Toon shading + UnrealBloom + turntable</div>
  <div id="err"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---- estado de teste exposto p/ Playwright headless ----
const LAB = window.LAB = {
  ready: false,      // vira true quando o 1º frame com o modelo já renderizou
  error: null,       // mensagem de erro fatal, se houver
  frames: 0,         // contador de frames renderizados
  rev: THREE.REVISION,
  anim: null,        // nome da animação tocando
  webgl: null,       // 'webgl2' | 'webgl' | null
};
// expostos só p/ depuração headless do spike (inofensivos)
Object.defineProperty(window, '__lab', { value: {}, writable: false });
document.getElementById('rev').textContent = THREE.REVISION;

function fail(msg) {
  LAB.error = String(msg);
  document.getElementById('err').textContent = 'ERRO: ' + LAB.error;
  console.error(msg);
}
window.addEventListener('error', e => fail(e.message));
window.addEventListener('unhandledrejection', e => fail(e.reason && e.reason.message || e.reason));

const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, preserveDrawingBuffer:true });
  LAB.webgl = renderer.capabilities.isWebGL2 ? 'webgl2' : 'webgl';
} catch (e) { fail('WebGL indisponível: ' + e.message); }

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping; // toon fica mais chapado/brilhante sem ACES
renderer.toneMappingExposure = 1.0;

const BG = 0x10141f;
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 11, 30); // neblina por profundidade (feel PS2)

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(0, 2.7, 7.0);
camera.lookAt(0, 2.1, 0);

// ---- iluminação: key quente + fill frio + ambiente baixo (cel-shading) ----
const key = new THREE.DirectionalLight(0xfff0d8, 3.2);
key.position.set(3, 6, 6);
scene.add(key);
const rim = new THREE.DirectionalLight(0x66ccff, 1.8);
rim.position.set(-5, 3, -4);
scene.add(rim);
// luz frontal (quase do ângulo da câmera) p/ acender as faces verticais do modelo
const fill = new THREE.DirectionalLight(0xffffff, 2.2);
fill.position.set(0.5, 2.5, 8);
scene.add(fill);
scene.add(new THREE.AmbientLight(0x4a5a74, 1.4));

// ponto quente embaixo (braseiro) — alimenta o bloom
const ember = new THREE.PointLight(0xff7a2a, 6, 14, 2);
ember.position.set(0, 0.4, 2.2);
scene.add(ember);

// ---- gradiente de 4 degraus p/ MeshToonMaterial (toon shading real) ----
function toonGradient(steps = 4) {
  const data = new Uint8Array(steps);
  for (let i = 0; i < steps; i++) data[i] = Math.round((i / (steps - 1)) * 255);
  const tex = new THREE.DataTexture(data, steps, 1, THREE.RedFormat);
  tex.minFilter = tex.magFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
}
const GRADIENT = toonGradient(4);

// converte materiais PBR do glTF em MeshToonMaterial preservando cor/mapa
function toToon(mat) {
  const t = new THREE.MeshToonMaterial({
    color: mat.color ? mat.color.clone() : new THREE.Color(0xffffff),
    map: mat.map || null,
    gradientMap: GRADIENT,
    transparent: mat.transparent,
    opacity: mat.opacity,
  });
  if (mat.emissive) { t.emissive = mat.emissive.clone(); t.emissiveIntensity = mat.emissiveIntensity || 1; }
  return t;
}

// chão simples (mosaico) só p/ dar escala e receber a neblina
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7, 48),
  new THREE.MeshToonMaterial({ color: 0x1a2230, gradientMap: GRADIENT })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// turntable: tudo que gira fica neste grupo
const turntable = new THREE.Group();
scene.add(turntable);

// ---- post-processing: render + UnrealBloom + output ----
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.65, 0.5, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

let mixer = null;
const clock = new THREE.Clock();

// ---- carrega o modelo CC0 animado ----
new GLTFLoader().load(
  '../vendor/models/RobotExpressive.glb',
  (gltf) => {
    const root = gltf.scene;
    root.traverse(o => {
      if (o.isMesh && o.material) {
        o.material = Array.isArray(o.material) ? o.material.map(toToon) : toToon(o.material);
        o.castShadow = o.receiveShadow = false;
      }
    });
    // Box3.setFromObject infla a caixa em meshes SKINNED (inclui ossos) → mede
    // a partir das boundingBox das geometrias, com root na identidade.
    root.position.set(0, 0, 0); root.scale.setScalar(1);
    root.updateMatrixWorld(true);
    const box = new THREE.Box3();
    root.traverse(o => {
      if (o.isMesh && o.geometry) {
        o.geometry.computeBoundingBox();
        box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
      }
    });
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const s = 4.0 / size.y;                 // normaliza p/ ~4 unidades de altura
    root.scale.setScalar(s);
    root.position.set(-center.x * s, -box.min.y * s, -center.z * s);
    turntable.add(root);
    window.__lab.root = root; window.__lab.camera = camera; window.__lab.THREE = THREE;

    // toca uma animação (preferir "Dance"/"Walking"), senão a 1ª
    if (gltf.animations && gltf.animations.length) {
      mixer = new THREE.AnimationMixer(root);
      // preferir clipes "no lugar" (sem root-motion) p/ ficar centralizado no turntable
      const byName = n => gltf.animations.find(a => a.name.toLowerCase() === n);
      const pick = ['idle','wave','thumbsup','dance'].map(byName).find(Boolean) || gltf.animations[0];
      mixer.clipAction(pick).play();
      LAB.anim = pick.name;
      document.getElementById('anim').textContent = pick.name;
    } else {
      document.getElementById('anim').textContent = '(sem animações)';
    }
  },
  undefined,
  (err) => fail('Falha ao carregar glTF: ' + (err && err.message || err))
);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  bloom.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

function tick() {
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  turntable.rotation.y += dt * 0.7;       // turntable
  ember.intensity = 5 + Math.sin(performance.now() * 0.006) * 1.6; // flicker
  composer.render();
  LAB.frames++;
  document.getElementById('frames').textContent = LAB.frames;
  // marca pronto quando o modelo já entrou em cena e renderizou alguns frames
  if (!LAB.ready && turntable.children.length > 0 && LAB.frames > 3) LAB.ready = true;
}
tick();
</script>
</body>
</html>

 * Você controla um herói MÓVEL pelo campo (invulnerável); ele ataca sozinho os
 * inimigos no alcance. Fases com scripts próprios, vários tipos de inimigo,

 * ==========================================================================*/

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let cw, ch, dpr, CX, CY, F;
const FOV = 46 * Math.PI / 180;
function resize() {
  dpr = window.devicePixelRatio || 1;
  cw = innerWidth; ch = innerHeight;
  canvas.width = Math.floor(cw * dpr); canvas.height = Math.floor(ch * dpr);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  CX = cw / 2; CY = ch / 2; F = (ch / 2) / Math.tan(FOV / 2);
}
addEventListener('resize', resize); resize();

/* ===== Util / álgebra ===== */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const fmt = (n) => { n = Math.floor(n); return n < 1000 ? '' + n : n < 1e6 ? (n / 1e3).toFixed(n < 1e4 ? 1 : 0) + 'K' : (n / 1e6).toFixed(1) + 'M'; };
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

/* ===== Câmera + projeção ===== */
const LIGHT = norm([-0.4, 1.0, 0.35]);
const LIGHT2 = norm([0.5, 0.35, -0.55]);            // luz de preenchimento (suaviza faces na sombra)
const AMB = 0.32, KEY = 0.85, FILL = 0.13;          // cel-shading: ambiente baixo (base escura) + key forte
let LIGHTS = [];                                     // luzes locais (braseiros) que clareiam superfícies no raio
const FOG = [46, 50, 78];                           // cor da neblina (casa com o horizonte do fundo)
const FOG_NEAR = 28, FOG_SPAN = 30, FOG_MAX = 0.45; // neblina leve (profundidade); a escuridão vem da vinheta
const camPos = [0, 19.5, 19], camTarget = [0, 0.5, -2.5];
let fwd, rgt, upv, CAM;
function setupCam(shx, shy) { CAM = [camPos[0] + shx, camPos[1] + shy, camPos[2]]; fwd = norm(sub(camTarget, CAM)); rgt = norm(cross(fwd, [0, 1, 0])); upv = cross(rgt, fwd); }
function project(p) { const r = sub(p, CAM); const depth = dot(r, fwd); if (depth < 0.05) return { vis: false }; return { vis: true, x: CX + dot(r, rgt) * F / depth, y: CY - dot(r, upv) * F / depth, depth }; }

/* ===== Buffers de faces (chão e objetos) ===== */
let FACES = [], FLOOR = [], SHADOWS = [], BUF = FACES;
const RGB = {};
const rgbOf = (h) => RGB[h] || (RGB[h] = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
// mistura uma cor com um "tint" (cache por par) — usado p/ recolorir variantes de elite
const TINTC = {};
function tintHex(hex, tint, f) { const k = hex + '|' + tint; let v = TINTC[k]; if (v) return v; const a = rgbOf(hex), b = rgbOf(tint), h2 = (i) => ('0' + Math.round(a[i] * (1 - f) + b[i] * f).toString(16)).slice(-2); return TINTC[k] = '#' + h2(0) + h2(1) + h2(2); }
const hexA = (h, a) => { const c = rgbOf(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; };
function pushQuad(a, b, c, d, rgb, center) {
  const n = norm(cross(sub(b, a), sub(c, a)));
  const fc = [(a[0] + b[0] + c[0] + d[0]) / 4, (a[1] + b[1] + c[1] + d[1]) / 4, (a[2] + b[2] + c[2] + d[2]) / 4];
  if (center && dot(n, sub(fc, center)) < 0) { n[0] *= -1; n[1] *= -1; n[2] *= -1; }
  if (dot(n, sub(fc, CAM)) >= 0) return;
  const pa = project(a), pb = project(b), pc = project(c), pd = project(d);
  if (!pa.vis || !pb.vis || !pc.vis || !pd.vis) return;
  const ndl = Math.max(0, dot(n, LIGHT)), ndf = Math.max(0, dot(n, LIGHT2));
  const toon = ndl > 0.55 ? 1 : ndl > 0.28 ? 0.6 : ndl > 0.08 ? 0.3 : 0;          // cel-shading (em degraus)
  let lr = AMB + KEY * toon + FILL * ndf, lg = AMB + KEY * toon * 0.99 + FILL * ndf, lb = AMB + KEY * toon * 0.9 + FILL * ndf;
  for (let i = 0; i < LIGHTS.length; i++) { const Lp = LIGHTS[i], lx = fc[0] - Lp.x, ly = fc[1] - Lp.y, lz = fc[2] - Lp.z, d2 = lx * lx + ly * ly + lz * lz; if (d2 < Lp.r2) { const a2 = 1 - d2 / Lp.r2, k = a2 * a2 * Lp.i; lr += Lp.c[0] * k; lg += Lp.c[1] * k; lb += Lp.c[2] * k; } }
  BUF.push({ s: [pa, pb, pc, pd], rgb, lr, lg, lb, z: (pa.depth + pb.depth + pc.depth + pd.depth) / 4 });
}
function box(cx, cy, cz, w, h, d, hex, cosA, sinA, pivot) {
  const rgb = rgbOf(hex), hw = w / 2, hh = h / 2, hd = d / 2, C = [];
  for (let sx = -1; sx <= 1; sx += 2) for (let sy = -1; sy <= 1; sy += 2) for (let sz = -1; sz <= 1; sz += 2) {
    const lx = cx + sx * hw - pivot[0], lz = cz + sz * hd - pivot[2];
    C.push([pivot[0] + lx * cosA + lz * sinA, cy + sy * hh, pivot[2] + (-lx * sinA + lz * cosA)]);
  }
  const lx = cx - pivot[0], lz = cz - pivot[2], ctr = [pivot[0] + lx * cosA + lz * sinA, cy, pivot[2] + (-lx * sinA + lz * cosA)];
  pushQuad(C[1], C[5], C[7], C[3], rgb, ctr); pushQuad(C[4], C[0], C[2], C[6], rgb, ctr);
  pushQuad(C[0], C[1], C[3], C[2], rgb, ctr); pushQuad(C[5], C[4], C[6], C[7], rgb, ctr);
  pushQuad(C[3], C[7], C[6], C[2], rgb, ctr); pushQuad(C[0], C[4], C[5], C[1], rgb, ctr);
}
function drawModel(parts, wx, wy, wz, ang, sc, tint) {
  const cosA = Math.cos(ang), sinA = Math.sin(ang), pv = [wx, wy, wz];
  for (const p of parts) box(wx + p.x * sc, wy + p.y * sc, wz + p.z * sc, p.w * sc, p.h * sc, p.d * sc, tint ? tintHex(p.c, tint, 0.42) : p.c, cosA, sinA, pv);

function pickUpgrades(n) {
  const W = [60, 30, 8, 2]; const used = new Set(); const res = [];
  for (let att = 0; att < 40 && res.length < n; att++) {
    const tw = UPGRADES.reduce((s,u)=>used.has(u.id)?s:s+W[u.r],0);
    let rv = Math.random()*tw;
    for (const u of UPGRADES) { if (used.has(u.id)) continue; rv-=W[u.r]; if (rv<=0){res.push(u.id);used.add(u.id);break;} }
  }
  return res;
}

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const tmp = a[i]; a[i] = a[j]; a[j] = tmp; } return a; }
function genLevel(n) {
  const r = mulberry((n * 2654435761) >>> 0);
  const maxIdx = Math.min(ROSTER.length - 1, Math.floor((n - 1) / 4));
  const pool = ROSTER.slice(0, maxIdx + 1);
  const hordeCount = 3 + Math.floor(r() * 5);
  const ec = eliteChance(n);
  const groups = [];
  for (let h = 0; h < hordeCount; h++) {
    const k = 1 + Math.floor(r() * Math.min(3, pool.length));
    const types = shuffle(pool, r).slice(0, k);
    for (const ty of types) {
      let count = 3 + Math.floor(r() * 4) + Math.floor(n / 40); if (ty === 'swarm') count += 4;
      const g = { type: ty, count: Math.min(24, count), gap: 0.16 + r() * 0.2, h };
      // só consome RNG p/ elite quando ec>0 → fases <24 mantêm o layout antigo
      if (ec && r() < ec) g.elite = ELITES[Math.floor(r() * ELITES.length)].id;
      groups.push(g);
    }
  }
  if (n % 10 === 0) { const b = ['boss_tank', 'boss_swift', 'boss_king']; groups.push({ type: b[((n / 10) | 0) % 3], count: 1, gap: 1 }); }
  return { name: 'Fase ' + n, groups, diff: 1 + (n - 1) * 0.05, hasElite: groups.some(g => g.elite) };
}

    if (G.battlePulse > 0) G.battlePulse = Math.max(0, G.battlePulse - dt * 4);
    if (G.skillCD > 0) G.skillCD = Math.max(0, G.skillCD - dt);

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint & smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check (todos os scripts)
        run: |
          for f in js/*.js test/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Smoke test do motor
        run: node test/smoke.test.js

name: lab-render-spike

# Prova de CI: renderiza WebGL (Three.js vendorizado) em Chromium headless e
# tira screenshot. Roda só quando o spike de render muda (raia MODELOS / M7).
on:
  push:
    paths:
      - 'lab/**'
      - 'vendor/**'
      - '.github/workflows/lab-render.yml'
  pull_request:
    paths:
      - 'lab/**'
      - 'vendor/**'
      - '.github/workflows/lab-render.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright (pacote + Chromium + deps)
        run: |
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Spike de render headless (WebGL → PNG)
        run: node lab/spike-render.mjs
      - name: Publicar screenshot como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-render
          path: lab/spike-render.png

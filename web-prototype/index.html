<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Bastion Rush</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #060810;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
        overscroll-behavior: none;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        display: block;
      }
      /* First-paint loader shown until Phaser boots. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(120% 100% at 50% 0%, #16203a 0%, #070a14 70%);
        color: #cdd7f0;
        transition: opacity 0.5s ease;
        z-index: 10;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot .mark {
        font-size: 13px;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #6f7fae;
        padding-left: 0.42em;
      }
      #boot h1 {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.04em;
        background: linear-gradient(180deg, #ffd98a, #ff8f5e);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 30px rgba(255, 160, 90, 0.25);
      }
      #boot .bar {
        width: 190px;
        height: 4px;
        border-radius: 4px;
        background: #1b2440;
        overflow: hidden;
      }
      #boot .bar > i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 4px;
        background: linear-gradient(90deg, #ffd98a, #ff7a4d);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(360%);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">
      <div class="mark">Aethelgard</div>
      <h1>BASTION&nbsp;RUSH</h1>
      <div class="bar"><i></i></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
